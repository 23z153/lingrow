<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<title>LinGrow AI: Dragon Academy — Train Your Mind. Awaken Your Dragon. Master English.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&family=Nunito+Sans:wght@700;800;900&family=Space+Grotesk:wght@600;700&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,500;1,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css?v=8.1">
<link rel="stylesheet" href="css/world-stage.css?v=8.1">
<link rel="stylesheet" href="css/weakwords.css?v=8.1">
<link rel="stylesheet" href="css/dragon-academy.css?v=8.1">
</head>
<body>
<div class="grain"></div>

<div id="login-screen"></div>

<div id="app">
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main-col">
    <header class="topbar" id="topbar"></header>
    <main class="view" id="view"><div class="view-inner" id="view-inner"></div></main>
  </div>
</div>

<!-- Global Floating AI Tutor Chatbot Drawer & FAB -->
<button id="global-chatbot-fab" class="global-chatbot-fab" aria-label="Open AI Tutor" title="Ask AI Tutor" style="display:none">
  <span class="chatbot-fab-icon"><i class="bi bi-chat-dots-fill"></i></span>
  <span class="chatbot-fab-pulse"></span>
</button>

<div id="global-chatbot-overlay" class="global-chatbot-overlay" style="display:none"></div>
<aside id="global-chatbot-drawer" class="global-chatbot-drawer" aria-label="AI Tutor Chat Drawer" aria-hidden="true">
  <div class="chatbot-drawer-header">
    <div class="chatbot-drawer-title">
      <div id="chatbot-mascot-avatar" class="chatbot-mascot-avatar" title="Ignis: Dragon Mentor">
        <span class="chatbot-drawer-badge" style="background:linear-gradient(135deg,#F59E0B,#EF4444);color:#0F172A">🐉</span>
      </div>
      <div>
        <div style="font-weight:700;font-size:15px;color:var(--color-text)">Ignis: Dragon Mentor</div>
        <div style="font-size:12px;color:var(--cream-dim)">Train Your Mind. Awaken Your Dragon.</div>
      </div>
    </div>
    <div class="chatbot-drawer-actions">
      <button class="btn btn-ghost btn-sm" id="chatbot-open-full-btn" title="Open full page" aria-label="Open full page">
        <i class="bi bi-arrows-angle-expand"></i> Full Page
      </button>
      <button class="icon-btn" id="chatbot-close-btn" title="Close drawer" aria-label="Close AI Tutor Drawer">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
  </div>

  <div id="chatbot-pipeline-status" class="chatbot-pipeline-status" style="display:none" aria-live="polite">
    <div class="pipeline-status-track">
      <span class="pipeline-chip" data-step="routing"><i class="bi bi-compass"></i> Routing</span>
      <span class="pipeline-arrow">›</span>
      <span class="pipeline-chip" data-step="drafting"><i class="bi bi-pencil-square"></i> Drafting</span>
      <span class="pipeline-arrow">›</span>
      <span class="pipeline-chip" data-step="verifying"><i class="bi bi-shield-check"></i> Verifying</span>
      <span class="pipeline-arrow">›</span>
      <span class="pipeline-chip" data-step="done"><i class="bi bi-check-circle-fill"></i> Ready</span>
    </div>
    <div class="pipeline-ember-bar"><div class="pipeline-ember-progress"></div></div>
  </div>

  <div class="chatbot-drawer-messages" id="chatbot-drawer-messages">
    <!-- Messages list -->
  </div>

  <div id="chatbot-quick-chips" class="chatbot-quick-chips"></div>

  <form class="chatbot-drawer-footer" id="chatbot-drawer-form">
    <input type="text" id="chatbot-drawer-input" placeholder="Ask your Dragon Mentor about grammar, words, or pronunciation…" autocomplete="off" aria-label="Message to AI Tutor" />
    <button type="submit" id="chatbot-drawer-send-btn" class="btn btn-primary btn-sm" aria-label="Send message" style="background:linear-gradient(135deg,#F59E0B,#D97706);border:none">
      <i class="bi bi-send-fill"></i>
    </button>
  </form>
</aside>

<div class="toast-wrap" id="toast-wrap"></div>

<script src="js/icons.js?v=8.1"></script>
<script src="js/api.js?v=8.1"></script>
<script src="js/speech.js?v=8.1"></script>
<script src="js/dragon-mascot.js?v=8.1"></script>
<script src="js/views-student.js?v=8.1"></script>
<script src="js/views-dragon-academy.js?v=8.1"></script>
<script src="js/views-simulator.js?v=8.1"></script>
<script src="js/views-world-stage.js?v=8.1"></script>
<script src="js/views-weakwords.js?v=8.1"></script>
<script src="js/views-idioms.js?v=8.1"></script>
<script src="js/views-onboarding.js?v=8.1"></script>
<script src="js/views-teacher.js?v=8.1"></script>
<script src="js/views-admin.js?v=8.1"></script>
<script src="js/app.js?v=8.1"></script>
</body>
</html>
